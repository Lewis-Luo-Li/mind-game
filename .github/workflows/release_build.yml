name: Release build

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-build:
    name: Release build (real ad IDs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decrypt AdMob secret.properties
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Never log the passphrase or file contents; just verify the file exists.
        run: |
          bash script/decrypt_secret.sh
          test -s secret.properties
          chmod 600 secret.properties
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
