<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
  
  <!-- Status Bar & Top Navigation -->
  <rect x="0" y="0" width="360" height="70" fill="#FFFFFF" />
  <text x="16" y="45" font-size="22" font-weight="bold" fill="#1E293B">←</text>
  <text x="180" y="42" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Sudoku · 6×6 Mini</text>
  <text x="330" y="45" font-size="20" fill="#1E293B">⚙</text>
  <line x1="0" y1="70" x2="360" y2="70" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Stats Bar -->
  <text x="24" y="100" font-size="14" fill="#64748B">⏱️ 01:15</text>
  <text x="180" y="100" font-size="14" fill="#64748B" text-anchor="middle">⚠️ 0/3</text>
  <text x="336" y="100" font-size="14" fill="#64748B" text-anchor="end">💡 3</text>

  <!-- 6x6 Grid Area -->
  <g transform="translate(18, 136)">
     <!-- Board Background -->
     <rect x="0" y="0" width="324" height="324" fill="#FFFFFF" />

     <!-- Interactive Highlights (Cell Size: 54) -->
     <rect x="0" y="162" width="324" height="54" fill="#F1F5F9" /> <!-- Horizontal Crosshair -->
     <rect x="108" y="0" width="54" height="324" fill="#F1F5F9" /> <!-- Vertical Crosshair -->
     <rect x="108" y="162" width="54" height="54" fill="#DBEAFE" /> <!-- Selected Active Cell -->
     <rect x="270" y="54" width="54" height="54" fill="#E2E8F0" /> <!-- Same Number Highlight (4) -->

     <!-- Grid Lines Minor (0.5dp) -->
     <path d="M54 0 v324 M108 0 v324 M216 0 v324 M270 0 v324" stroke="#CBD5E1" stroke-width="1"/>
     <path d="M0 54 h324 M0 162 h324 M0 270 h324" stroke="#CBD5E1" stroke-width="1"/>

     <!-- Grid Lines Major (2.5dp) - 2 Rows x 3 Cols layout -->
     <path d="M162 0 v324" stroke="#1E293B" stroke-width="2.5"/> <!-- Center Vertical -->
     <path d="M0 108 h324 M0 216 h324" stroke="#1E293B" stroke-width="2.5"/> <!-- Two Horizontal -->
     
     <!-- Grid Outer Border -->
     <rect x="0" y="0" width="324" height="324" fill="none" stroke="#1E293B" stroke-width="3" rx="2" />

     <!-- Sample Clues and User Inputs -->
     <text x="27" y="27" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">1</text>
     <text x="135" y="27" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">3</text>
     
     <!-- Selected / User Input -->
     <text x="135" y="189" font-size="24" font-weight="normal" fill="#2563EB" text-anchor="middle" dominant-baseline="central">4</text>
     
     <!-- Matched Highlight -->
     <text x="297" y="81" font-size="24" font-weight="normal" fill="#2563EB" text-anchor="middle" dominant-baseline="central">4</text>
  </g>

  <!-- Auxiliary Action Bar -->
  <g transform="translate(18, 510)" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">
     <text x="40" y="0">⤺ Undo</text>
     <text x="121" y="0">✏️ Notes</text>
     <text x="202" y="0">🧹 Erase</text>
     <text x="284" y="0">💡 Hint</text>
  </g>

  <!-- Number Keypad 1-6 -->
  <g transform="translate(28, 550)">
     <!-- 1 --> <rect x="0" y="0" width="44" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="22" y="30" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">1</text>
     <!-- 2 --> <rect x="52" y="0" width="44" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="74" y="30" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">2</text>
     <!-- 3 --> <rect x="104" y="0" width="44" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="126" y="30" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">3</text>
     <!-- 4 --> <rect x="156" y="0" width="44" height="50" rx="6" fill="#F1F5F9" stroke="#94A3B8"/><text x="178" y="30" font-size="22" font-weight="600" fill="#1E3A8A" text-anchor="middle">4</text>
     <!-- 5 --> <rect x="208" y="0" width="44" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="230" y="30" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">5</text>
     <!-- 6 --> <rect x="260" y="0" width="44" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="282" y="30" font-size="22" font-weight="600" fill="#2563EB" text-anchor="middle">6</text>
  </g>
</svg>
