<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
  
  <!-- Status Bar & Top Navigation -->
  <rect x="0" y="0" width="360" height="70" fill="#FFFFFF" />
  <text x="16" y="45" font-size="22" font-weight="bold" fill="#1E293B">←</text>
  <text x="180" y="42" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Classic Sudoku · Expert</text>
  <text x="330" y="45" font-size="20" fill="#1E293B">⚙</text>
  <line x1="0" y1="70" x2="360" y2="70" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Stats Bar -->
  <text x="24" y="100" font-size="14" fill="#64748B">⏱️ 03:45</text>
  <text x="180" y="100" font-size="14" fill="#64748B" text-anchor="middle">⚠️ 1/3</text>
  <text x="336" y="100" font-size="14" fill="#64748B" text-anchor="end">💡 3</text>

  <!-- 9x9 Grid Area (Responsive Square) -->
  <g transform="translate(18, 136)">
     <!-- Board Background -->
     <rect x="0" y="0" width="324" height="324" fill="#FFFFFF" />

     <!-- Interactive Highlights -->
     <rect x="0" y="144" width="324" height="36" fill="#F1F5F9" /> <!-- Horizontal Crosshair -->
     <rect x="72" y="0" width="36" height="324" fill="#F1F5F9" /> <!-- Vertical Crosshair -->
     <rect x="72" y="144" width="36" height="36" fill="#DBEAFE" /> <!-- Selected Active Cell -->
     <rect x="144" y="180" width="36" height="36" fill="#E2E8F0" /> <!-- Same Number Highlight (7) -->

     <!-- Grid Lines Minor (0.5dp inner cells) -->
     <path d="M36 0 v324 M72 0 v324 M144 0 v324 M180 0 v324 M252 0 v324 M288 0 v324" stroke="#CBD5E1" stroke-width="1"/>
     <path d="M0 36 h324 M0 72 h324 M0 144 h324 M0 180 h324 M0 252 h324 M0 288 h324" stroke="#CBD5E1" stroke-width="1"/>

     <!-- Grid Lines Major (2.0dp subgrids) -->
     <path d="M108 0 v324 M216 0 v324" stroke="#1E293B" stroke-width="2.5"/>
     <path d="M0 108 h324 M0 216 h324" stroke="#1E293B" stroke-width="2.5"/>
     
     <!-- Grid Outer Border -->
     <rect x="0" y="0" width="324" height="324" fill="none" stroke="#1E293B" stroke-width="3" rx="2" />

     <!-- Sample Clues and User Inputs -->
     <text x="18" y="18" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">5</text>
     <text x="54" y="18" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">3</text>
     
     <!-- Selected / User Input -->
     <text x="90" y="162" font-size="20" font-weight="normal" fill="#2563EB" text-anchor="middle" dominant-baseline="central">4</text>
     
     <!-- Matched Highlight Number -->
     <text x="162" y="198" font-size="20" font-weight="normal" fill="#2563EB" text-anchor="middle" dominant-baseline="central">7</text>
  </g>

  <!-- Auxiliary Action Bar -->
  <g transform="translate(18, 510)" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">
     <text x="40" y="0">⤺ Undo</text>
     <text x="121" y="0">✏️ Notes</text>
     <text x="202" y="0">🧹 Erase</text>
     <text x="284" y="0">💡 Hint</text>
  </g>

  <!-- Number Keypad (Thumb Zone) -->
  <g transform="translate(18, 550)">
     <!-- 1 --> <rect x="0" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="16" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">1</text>
     <!-- 2 --> <rect x="36" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="52" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">2</text>
     <!-- 3 --> <rect x="72" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="88" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">3</text>
     <!-- 4 --> <rect x="108" y="0" width="32" height="48" rx="6" fill="#F1F5F9" stroke="#94A3B8"/><text x="124" y="28" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">4</text>
     <!-- 5 --> <rect x="144" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="160" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">5</text>
     <!-- 6 --> <rect x="180" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="196" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">6</text>
     <!-- 7 --> <rect x="216" y="0" width="32" height="48" rx="6" fill="#E2E8F0" stroke="#CBD5E1"/><text x="232" y="28" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">7</text> <!-- Completed digit state -->
     <!-- 8 --> <rect x="252" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="268" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">8</text>
     <!-- 9 --> <rect x="288" y="0" width="32" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="304" y="28" font-size="20" font-weight="600" fill="#2563EB" text-anchor="middle">9</text>
     
     <!-- Small Badges (Remaining count) -->
     <g font-size="10" fill="#64748B" text-anchor="middle">
       <text x="16" y="42">2</text>
       <text x="52" y="42">4</text>
       <text x="88" y="42">1</text>
       <text x="124" y="42">0</text>
       <text x="160" y="42">3</text>
       <text x="196" y="42">5</text>
       <text x="232" y="42">0</text>
       <text x="268" y="42">1</text>
       <text x="304" y="42">0</text>
     </g>
  </g>
</svg>
